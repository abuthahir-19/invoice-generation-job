# Test Configuration for Invoice Generation Application
# Uses H2 in-memory database for testing

# Spring Batch
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
app.batch.shutdown-on-complete=false

# DataSource Configuration (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable Cloud SQL connector (override any main props)
spring.cloud.gcp.core.enabled=false
spring.cloud.gcp.storage.enabled=false
spring.cloud.gcp.sql.enabled=false
spring.cloud.gcp.sql.database-name=
spring.cloud.gcp.sql.instance-connection-name=
#spring.cloud.gcp.storage.enabled=false  # If using GCS in code

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (optional, for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.com.subscription.InvoiceGeneration=DEBUG
logging.level.org.springframework.batch=DEBUG
logging.level.org.hibernate.SQL=DEBUG